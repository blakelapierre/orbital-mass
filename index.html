<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital Mass — Strategy Prototype</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#000; color:#ddd; font-family:monospace; overflow:hidden; touch-action:none; }
  #ui { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.8); padding:10px; border-radius:6px; z-index:10; max-width:420px; }
  button { margin:2px; padding:6px 10px; background:#222; color:#ddd; border:1px solid #444; cursor:pointer; }
  button:hover { background:#333; }
  #info { position:absolute; bottom:8px; left:8px; background:rgba(0,0,0,.8); padding:8px; font-size:12px; max-width:520px; }
  #checkpoint { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.85); padding:10px; max-width:340px; font-size:11px; white-space:pre-wrap; max-height:50vh; overflow:auto; border:1px solid #333; }
  canvas { display:block; }
  .playerA { color:#ff5555; }
  .playerB { color:#55ff55; }
</style>
</head>
<body>
<div id="ui">
  <b>Orbital Mass</b> — live + camera<br>
  <span class="playerA">● Player A</span> / <span class="playerB">● Player B</span><br>
  <button id="pause">Pause</button>
  <button id="step">Step (optional)</button>
  <button id="checkpoint">Checkpoint</button>
  <button id="reset">Reset</button><br>
  <button id="depositA">Mock Deposit A</button>
  <button id="depositB">Mock Deposit B</button><br>
  <span id="status">running</span><br>
  <small>Wheel/pinch to zoom. Drag to pan. Click ship then click dest. Ships slow near target.</small>
</div>
<div id="checkpoint">No checkpoint yet</div>
<div id="info">
  Live N-body. Zoom + pan. Orders decelerate on arrival.
</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

const G = 6e-4;
const dt = 0.06;
let running = true;
let epoch = 0;
let selected = null;

let camX = 0, camY = 0, camScale = 1.2;
let dragging = false;
let lastMX = 0, lastMY = 0;
let pinchDist = 0;

class Body {
  constructor(x, y, vx, vy, mass, color, isShip=false, claimId=null, owner='system') {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.mass = mass;
    this.color = color;
    this.isShip = isShip;
    this.claimId = claimId || Math.random().toString(36).slice(2, 8);
    this.owner = owner;
    this.order = null;
    this.r = Math.max(4, Math.cbrt(mass) * 0.6);
  }
}

const bodies = [];
function init() {
  bodies.length = 0;
  bodies.push(new Body(0, 0, 0, 0, 1800, '#ffaa33', false, 'star', 'system'));
  bodies.push(new Body(160, 0, 0, 0.5, 70, '#4488ff', false, 'planet1', 'system'));
  bodies.push(new Body(-190, 50, 0.12, -0.4, 40, '#44aa88', false, 'planet2', 'system'));
  bodies.push(new Body(70, 60, 0.1, 0.15, 12, '#ff4444', true, 'claimA1', 'A'));
  bodies.push(new Body(-80, -70, -0.08, 0.12, 10, '#44ff44', true, 'claimB1', 'B'));
  selected = null;
  epoch = 0;
  camX = 0; camY = 0; camScale = 1.2;
  document.getElementById('checkpoint').textContent = 'No checkpoint yet';
  updateStatus();
}
init();

function applyOrders() {
  for (const b of bodies) {
    if (!b.isShip || !b.order) continue;
    const dx = b.order.tx - b.x;
    const dy = b.order.ty - b.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 12) {
      b.vx *= 0.85;
      b.vy *= 0.85;
      if (Math.hypot(b.vx, b.vy) < 0.05) { b.order = null; b.vx = 0; b.vy = 0; }
      continue;
    }
    const desiredSpeed = Math.min(0.8, dist * 0.015);
    const ux = dx / dist, uy = dy / dist;
    const targetVx = ux * desiredSpeed;
    const targetVy = uy * desiredSpeed;
    b.vx += (targetVx - b.vx) * 0.08;
    b.vy += (targetVy - b.vy) * 0.08;
  }
}

function step(n=1) {
  for (let s = 0; s < n; s++) {
    applyOrders();
    for (let i = 0; i < bodies.length; i++) {
      const a = bodies[i];
      let ax = 0, ay = 0;
      for (let j = 0; j < bodies.length; j++) {
        if (i === j) continue;
        const b = bodies[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy + 8;
        const f = G * b.mass / d2;
        const d = Math.sqrt(d2);
        ax += f * dx / d;
        ay += f * dy / d;
      }
      a.vx += ax * dt;
      a.vy += ay * dt;
    }
    for (const b of bodies) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    }
  }
  updateStatus();
}

function makeCheckpoint() {
  epoch++;
  const claims = bodies.filter(b => b.isShip).map(b => ({
    id: b.claimId,
    owner: b.owner,
    mass: Math.round(b.mass * 10) / 10,
    x: Math.round(b.x),
    y: Math.round(b.y),
    vx: Math.round(b.vx * 100) / 100,
    vy: Math.round(b.vy * 100) / 100
  }));
  const root = simpleHash(JSON.stringify(claims));
  const cp = { epoch, stateRoot: root, claims, note: 'On-chain checkpoint root' };
  document.getElementById('checkpoint').textContent = JSON.stringify(cp, null, 2);
  updateStatus();
}

function simpleHash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return '0x' + (h >>> 0).toString(16).padStart(8, '0');
}

function worldToScreen(wx, wy) {
  const cx = W / 2, cy = H / 2;
  return {
    x: cx + (wx - camX) * camScale,
    y: cy + (wy - camY) * camScale
  };
}
function screenToWorld(sx, sy) {
  const cx = W / 2, cy = H / 2;
  return {
    x: camX + (sx - cx) / camScale,
    y: camY + (sy - cy) / camScale
  };
}

function draw() {
  ctx.fillStyle = '#00000a';
  ctx.fillRect(0, 0, W, H);

  for (const b of bodies) {
    if (b.order) {
      const a = worldToScreen(b.x, b.y);
      const t = worldToScreen(b.order.tx, b.order.ty);
      ctx.strokeStyle = b.owner === 'A' ? '#ff5555' : '#55ff55';
      ctx.setLineDash([6, 4]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(t.x, t.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  for (const b of bodies) {
    const p = worldToScreen(b.x, b.y);
    ctx.beginPath();
    ctx.fillStyle = b === selected ? '#ffff00' : b.color;
    const r = Math.max(3, b.r * camScale * 0.4);
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
    if (b.isShip) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = '11px monospace';
      ctx.fillText(b.owner, p.x + r + 4, p.y - r);
    }
  }
}

function updateStatus() {
  const aMass = bodies.filter(b => b.owner === 'A').reduce((s, b) => s + b.mass, 0);
  const bMass = bodies.filter(b => b.owner === 'B').reduce((s, b) => s + b.mass, 0);
  document.getElementById('status').textContent =
    `LIVE | zoom ${camScale.toFixed(2)} | epoch ${epoch} | A:${aMass.toFixed(1)} B:${bMass.toFixed(1)} | sel:${selected ? selected.claimId : 'none'}`;
}

let last = 0;
function loop(t) {
  if (running && t - last > 30) { step(1); last = t; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.getElementById('pause').onclick = () => { running = !running; updateStatus(); };
document.getElementById('step').onclick = () => step(5);
document.getElementById('checkpoint').onclick = makeCheckpoint;
document.getElementById('reset').onclick = () => { init(); };
document.getElementById('depositA').onclick = () => {
  bodies.push(new Body((Math.random()-0.5)*120, (Math.random()-0.5)*120, (Math.random()-0.5)*0.15, (Math.random()-0.5)*0.15, 6 + Math.random()*4, '#ff6666', true, null, 'A'));
};
document.getElementById('depositB').onclick = () => {
  bodies.push(new Body((Math.random()-0.5)*120, (Math.random()-0.5)*120, (Math.random()-0.5)*0.15, (Math.random()-0.5)*0.15, 6 + Math.random()*4, '#66ff66', true, null, 'B'));
};

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const before = screenToWorld(e.clientX, e.clientY);
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  camScale = Math.max(0.2, Math.min(8, camScale * factor));
  const after = screenToWorld(e.clientX, e.clientY);
  camX += before.x - after.x;
  camY += before.y - after.y;
  updateStatus();
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const w = screenToWorld(e.clientX, e.clientY);
  let hit = null, best = 30 / camScale;
  for (const b of bodies) {
    if (!b.isShip) continue;
    const d = Math.hypot(b.x - w.x, b.y - w.y);
    if (d < best) { best = d; hit = b; }
  }
  if (hit) {
    selected = hit;
    updateStatus();
    dragging = false;
    return;
  }
  if (selected && selected.isShip) {
    selected.order = { tx: w.x, ty: w.y };
    dragging = false;
    return;
  }
  dragging = true;
  lastMX = e.clientX;
  lastMY = e.clientY;
});
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = (e.clientX - lastMX) / camScale;
  const dy = (e.clientY - lastMY) / camScale;
  camX -= dx;
  camY -= dy;
  lastMX = e.clientX;
  lastMY = e.clientY;
});
canvas.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('mouseleave', () => { dragging = false; });

canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.hypot(dx, dy);
    dragging = false;
  } else if (e.touches.length === 1) {
    const t = e.touches[0];
    const w = screenToWorld(t.clientX, t.clientY);
    let hit = null, best = 40 / camScale;
    for (const b of bodies) {
      if (!b.isShip) continue;
      const d = Math.hypot(b.x - w.x, b.y - w.y);
      if (d < best) { best = d; hit = b; }
    }
    if (hit) {
      selected = hit;
      updateStatus();
      dragging = false;
    } else if (selected && selected.isShip) {
      selected.order = { tx: w.x, ty: w.y };
      dragging = false;
    } else {
      dragging = true;
      lastMX = t.clientX;
      lastMY = t.clientY;
    }
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2 && pinchDist > 0) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const factor = dist / pinchDist;
    camScale = Math.max(0.2, Math.min(8, camScale * factor));
    pinchDist = dist;
    updateStatus();
  } else if (e.touches.length === 1 && dragging) {
    const t = e.touches[0];
    const dx = (t.clientX - lastMX) / camScale;
    const dy = (t.clientY - lastMY) / camScale;
    camX -= dx;
    camY -= dy;
    lastMX = t.clientX;
    lastMY = t.clientY;
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { dragging = false; pinchDist = 0; });
</script>
</body>
</html>
